<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation</title>
</head>
<body>
    <center>
    <h3>Quotation</h3>
    <table>
        <tr>
            <td>Quotation Number:</td>
            <td><input type="text" name="" id="" placeholder="Enter Quotation Number"></td> <br>
        </tr>
        <tr>
            <td>Proposal Date:</td>
            <td><input type="date" name="" id=""></td><br>
        </tr>
        <tr>
            <td>Status:</td>
            <td><select >
                <option>APPROVED</option>
                <option>NOT APPROVED</option>
                <option>PENDING</option>
            </select></td><br>
        </tr>
        <tr>
            <td>Customer:</td>
            <td><input type="text" name="" id="" placeholder="Enter Customer"></td>
        </tr>
        <tr>
            <td>Customer contact:</td>
            <td><input type="text" name="" id=""placeholder="Enter contact number"></td><br>
        </tr>
        <tr>
            <td>Customer mail:</td>
            <td><input type="text" name="" id=""placeholder="Enter email"></td><br>
        </tr>
        <tr>
            <td>GSTIN:</td>
            <td><input type="text" name="" id=""placeholder="Enter GSTIN"></td><br>
        </tr>
    </table>
    </center>
</body>
</html>
