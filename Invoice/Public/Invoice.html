
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Invoice</title>
</head>
<body>

    <center>
        <h3>Create Invoice</h3>

        <form id="invoiceForm">
            <table>
                <tr>
                    <td>Invoice Number:</td>
                    <td>
                        <input type="text" id="invoiceNo"
                            placeholder="Enter Invoice Number" required>
                    </td>
                </tr>

                <tr>
                    <td>Invoice Date:</td>
                    <td>
                        <input type="date" id="invoiceDate" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer:</td>
                    <td>
                        <input type="text" id="invoiceCustomer"
                            placeholder="Enter Customer" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer Contact:</td>
                    <td>
                        <input type="text" id="invoiceContact"
                            placeholder="Enter Contact Number" required>
                    </td>
                </tr>

                <tr>
                    <td>Customer Mail:</td>
                    <td>
                        <input type="email" id="invoiceMail"
                            placeholder="Enter Email" required>
                    </td>
                </tr>

                <tr>
                    <td>GSTIN:</td>
                    <td>
                        <input type="text" id="invoiceGSTIN"
                            placeholder="Enter GSTIN">
                    </td>
                </tr>
            </table>

            <br>

            <button type="submit">Save Invoice</button>

            <button type="button"
                onclick="window.location.href='/invoice'">
                Back
            </button>
        </form>
    </center>

    <script src="/invoice-assets/Invoice.js"></script>

</body>
</html>
