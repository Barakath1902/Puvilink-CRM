
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry</title>
</head>

<body>

    <center>
        <h3>Enquiry</h3>

        <form id="enquiryForm">

            <table>
                <tr>
                    <td>Enquiry Number:</td>
                    <td>
                        <input type="text" id="enquiryNo"
                        placeholder="Enter enquiry Number" required>
                    </td>
                </tr>

                <tr>
                    <td>Enquiry Date:</td>
                    <td>
                        <input type="date" id="enquiryDate" required>
                    </td>
                </tr>

                <tr>
                    <td>Company name:</td>
                    <td>
                        <input type="text" id="companyName"
                        placeholder="Enter Company name" required>
                    </td>
                </tr>

                <tr>
                    <td>Phone no:</td>
                    <td>
                        <input type="text" id="mobileNo"
                        placeholder="Enter phone number" required>
                    </td>
                </tr>

                <tr>
                    <td>Lead Source:</td>
                    <td>
                        <input type="text" id="leadSource"
                        placeholder="Enter lead source">
                    </td>
                </tr>

                <tr>
                    <td>Enquiry category:</td>
                    <td>
                        <input type="text" id="enquiryCategory"
                        placeholder="Enter enquiry category">
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <button type="submit" id="submitButton">Save Enquiry</button>
                    </td>
                </tr>

            </table>

        </form>
    </center>

  <script src="Enquiry.js"></script>

</body>
</html>
